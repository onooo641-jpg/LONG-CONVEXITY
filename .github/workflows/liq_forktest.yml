            router: "0xbb00ff08d01d300023c629e8ffffcb65a5a578ce"
            fund: slot
            amt_usd: "3000"
            rpcs: "https://avalanche.gateway.tenderly.co https://avalanche-c-chain-rpc.publicnode.com"
          - chain: polygon_weth
            pool: "0x794a61358d6845594f94dc1db02a252b5b4814ad"
            coll: "0x7ceb23fd6bc0add59e62ac25578270cff1b9f619"
            debt: "0x3c499c542cef5e3811e1192ce70d8cc03d5c3359"
            router: "0x68b3465833fb72a70ecdf485e0e4c7bd8665fc45"
            fund: slot
            amt_usd: "20000"
            rpcs: "https://poly.api.pocket.network https://polygon.gateway.tenderly.co"
          - chain: polygon_wbtc
            pool: "0x794a61358d6845594f94dc1db02a252b5b4814ad"
            coll: "0x1bfd67037b42cf73acf2047067bd4f2c47d9bfd6"
            debt: "0x3c499c542cef5e3811e1192ce70d8cc03d5c3359"
            router: "0x68b3465833fb72a70ecdf485e0e4c7bd8665fc45"
            fund: slot
            amt_usd: "20000"
            rpcs: "https://poly.api.pocket.network https://polygon.gateway.tenderly.co"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Fork test
        env:
          POOL: ${{ matrix.pool }}
          COLL: ${{ matrix.coll }}
          DEBT: ${{ matrix.debt }}
          ROUTER: ${{ matrix.router }}
          FEES: "500,3000,100,10000"
          FUND: ${{ matrix.fund || 'wrap' }}
          AMT_USD: ${{ matrix.amt_usd || '30000' }}
          VERB: ${{ matrix.verb || '-vv' }}
        run: |
          mkdir -p docs/jx_runs
          log="docs/jx_runs/liq_forktest_${{ matrix.chain }}_${{ github.run_id }}.txt"
          echo "fork test ${{ matrix.chain }} run ${{ github.run_id }} $(date -u +%FT%TZ)" > "$log"
          rc=1
          for u in ${{ matrix.rpcs }}; do
            if cast block-number --rpc-url "$u" >/dev/null 2>&1; then
              echo "== rpc $u" | tee -a "$log"
              export RPC_URL="$u"
              frc=0
              forge test --root contracts $VERB --fork-retries 8 --fork-retry-backoff 3000 > "$log.tmp" 2>&1 || frc=$?
              tail -n 400 "$log.tmp" | tee -a "$log"
              rm -f "$log.tmp"
              if [ "$frc" = "0" ]; then rc=0; break; fi
            else
              echo "== rpc $u unreachable" | tee -a "$log"
            fi
          done
          echo "exit $rc" | tee -a "$log"
          exit $rc
      - name: Commit log
        if: always()
        run: .github/scripts/commit_push.sh "forktest-${{ matrix.chain }}"
