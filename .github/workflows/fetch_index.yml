# Quote or download 1-minute bars for another index from Databento.
#
# Two ways to start it:
#   1. Actions tab -> "fetch other index" -> Run workflow (one symbol, one window).
#   2. Push a change to .github/fetch_request.txt. Each non-comment line is
#        SYMBOL MODE START END MAX_COST_USD
#      and is run in order. This exists because the agent sandbox can push but
#      cannot call the Actions API to dispatch a run.
#
# mode=quote    prints the price and downloads nothing (a quote is free).
# mode=download downloads (aborts if the quote is over MAX_COST_USD) and commits
#               data/raw/<SYMBOL>_1m_<start>_<end>.parquet.
# Every run commits its full output to docs/jx_runs/fetch_<run id>.txt so the
# result can be read from the repo, not only from the Actions log.
# Uses the DATABENTO_API_KEY repository secret.

name: fetch other index

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "continuous symbol"
        type: choice
        options: [ES.v.0, YM.v.0, RTY.v.0, ALL_THREE]
        default: ES.v.0
      mode:
        description: "quote = price only, download = buy and commit"
        type: choice
        options: [quote, download]
        default: quote
      start:
        description: "inclusive UTC date"
        default: "2010-06-06"
      end:
        description: "exclusive UTC date"
        default: "2026-10-29"
      max_cost_usd:
        description: "abort if a single symbol's quote is above this"
        default: "10"
  push:
    branches: [claude/ict-trading-resources-ugh07b]
    paths: [.github/fetch_request.txt]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra data
      - name: Build the job list
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            syms="${{ inputs.symbol }}"
            [ "$syms" = "ALL_THREE" ] && syms="ES.v.0 YM.v.0 RTY.v.0"
            : > jobs.txt
            for s in $syms; do
              echo "$s ${{ inputs.mode }} ${{ inputs.start }} ${{ inputs.end }} ${{ inputs.max_cost_usd }}" >> jobs.txt
            done
          else
            grep -v '^\s*#' .github/fetch_request.txt | grep -v '^\s*$' > jobs.txt
          fi
          cat jobs.txt
      - name: Quote or download
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: |
          if [ -z "$DATABENTO_API_KEY" ]; then echo "::error::DATABENTO_API_KEY secret is not set"; exit 1; fi
          mkdir -p docs/jx_runs
          log="docs/jx_runs/fetch_${{ github.run_id }}.txt"
          echo "fetch other index  run ${{ github.run_id }}  event ${{ github.event_name }}  $(date -u +%FT%TZ)" > "$log"
          rc=0
          while read -r sym mode start end cap; do
            extra=""
            [ "$mode" = "quote" ] && extra="--dry-run"
            uv run python scripts/fetch_databento.py --symbol "$sym" \
              --start "$start" --end "$end" --max-cost-usd "$cap" $extra \
              < /dev/null 2>&1 | tee -a "$log" || rc=1   # default shell has pipefail
          done < jobs.txt
          echo "exit $rc" >> "$log"
          exit $rc
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/jx_runs data/raw
          git diff --cached --quiet && exit 0
          git commit -m "fetch other index: run ${{ github.run_id }} output"
          # The branch can move while a download runs (another push lands).
          # Rebase onto it and retry rather than lose data already paid for.
          for i in 1 2 3 4 5; do
            git pull --rebase --no-edit origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 10))
          done
          exit 1
      - name: Keep the files if the push failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-${{ github.run_id }}
          path: |
            data/raw/*.parquet
            docs/jx_runs/fetch_*.txt
          retention-days: 30
