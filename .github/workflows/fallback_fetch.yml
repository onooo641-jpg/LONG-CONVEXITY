# Data for docs/PREREG_FALLBACK_20261121.md. Started by pushing .github/fallback_request.txt or manually.
name: fallback fetch
on:
  workflow_dispatch: {}
  push:
    branches: [claude/ict-trading-resources-ugh07b]
    paths: [.github/fallback_request.txt]
permissions:
  contents: write
concurrency:
  group: fallback-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: |
          mkdir -p docs/jx_runs
          jobs=$(grep -v '^\s*#' .github/fallback_request.txt | grep -v '^\s*$' | tr '\n' ' ')
          uv run python scripts/fetch_fallback.py $jobs 2>&1 | tee docs/jx_runs/fetch_fallback_${{ github.run_id }}.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/public/fallback_* data/public/fundgap_* data/public/borrowloop_* data/public/hedged_* data/public/corrloop_* data/public/batch4_* data/public/batch5_* data/public/wrappers_* data/public/lendborrow_now* data/public/pendle_* data/public/staking_apr* data/public/sp_* data/public/batch6_* data/public/votium_* data/public/batch7_* data/public/batch8_* data/public/batch8s_* data/public/vxn_* data/public/batch9_* data/public/batch10_* data/public/batch10b_* data/public/smallcap_* data/public/merkl_* data/public/sweep3_* data/public/repair8_* data/public/addprice_* data/public/sweep4_* data/public/sweep4b_* docs/jx_runs; do [ -e "$f" ] && git add "$f"; done; true
          git diff --cached --quiet && exit 0
          git commit -m "fallback fetch: run ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs --no-edit origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 10))
          done
          exit 1
